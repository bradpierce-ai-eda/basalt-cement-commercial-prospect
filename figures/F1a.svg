<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820"><rect width="100%" height="100%" fill="white"/><text x="450" y="38" font-family="Arial" font-size="29" fill="#193944" text-anchor="middle" font-weight="bold">Conventional cement manufacture</text><rect x="200" y="78" width="500" height="70" rx="8" fill="#edf3f5" stroke="#7c919c" stroke-width="1.5"/><text x="450.0" y="121.0" font-family="Arial" font-size="23" fill="#193944" text-anchor="middle" font-weight="normal">Limestone and other raw supplies</text><rect x="200" y="192" width="500" height="70" rx="8" fill="#edf3f5" stroke="#7c919c" stroke-width="1.5"/><text x="450.0" y="235.0" font-family="Arial" font-size="23" fill="#193944" text-anchor="middle" font-weight="normal">Prepare, proportion and blend</text><rect x="200" y="306" width="500" height="70" rx="8" fill="#edf3f5" stroke="#7c919c" stroke-width="1.5"/><text x="450.0" y="349.0" font-family="Arial" font-size="23" fill="#193944" text-anchor="middle" font-weight="normal">Preheat and precalcine</text><rect x="200" y="420" width="500" height="70" rx="8" fill="#edf3f5" stroke="#7c919c" stroke-width="1.5"/><text x="450.0" y="463.0" font-family="Arial" font-size="23" fill="#193944" text-anchor="middle" font-weight="normal">Form clinker in the rotary kiln</text><rect x="200" y="534" width="500" height="70" rx="8" fill="#edf3f5" stroke="#7c919c" stroke-width="1.5"/><text x="450.0" y="577.0" font-family="Arial" font-size="23" fill="#193944" text-anchor="middle" font-weight="normal">Cool and handle clinker</text><rect x="200" y="648" width="500" height="70" rx="8" fill="#edf3f5" stroke="#7c919c" stroke-width="1.5"/><text x="450.0" y="691.0" font-family="Arial" font-size="23" fill="#193944" text-anchor="middle" font-weight="normal">Grind with additions to make cement</text><line x1="450" y1="148" x2="450" y2="192" stroke="#607d89" stroke-width="2.4"/><polygon points="450.00,192.00 445.22,182.10 454.78,182.10" fill="#607d89"/><line x1="4